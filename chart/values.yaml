# Default values for game-server chart
# This is a template - copy a game-specific values file from games/ directory

# Game server image
image:
  repository: ""  # e.g., factoriotools/factorio
  tag: "stable"
  pullPolicy: IfNotPresent

# Server name/identifier
name: "game-server"

# Resource limits
resources:
  requests:
    memory: "1Gi"
    cpu: "500m"
  limits:
    memory: "4Gi"
    cpu: "2000m"

# Persistent storage for save data
persistence:
  enabled: true
  storageClass: ""  # Use default storage class
  size: "10Gi"
  mountPath: "/data"

# Service configuration (NodePort for external access)
service:
  type: NodePort
  ports: []
    # Example:
    # - name: game
    #   port: 27015
    #   nodePort: 30015
    #   protocol: UDP

# Environment variables
env: []
  # Example:
  # - name: SERVER_NAME
  #   value: "My Server"

# Game-specific configuration files
# These will be mounted as ConfigMaps
gameConfig:
  enabled: false
  files: {}
    # Example:
    # server-settings.json: |
    #   {
    #     "name": "My Server",
    #     "max_players": 10
    #   }

# Node affinity (optional - pin to specific nodes)
nodeSelector: {}
  # Example:
  # kubernetes.io/hostname: node1

# Tolerations (optional)
tolerations: []

# Security context
securityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsNonRoot: true
