# Factorio Dedicated Server Configuration

# Server identity
name: factorio

# Factorio Docker image
# Using rootless variant to avoid NFS permission issues
# See: https://github.com/factoriotools/factorio-docker/blob/master/PERMISSION_ISSUES_GUIDE.md
image:
  repository: factoriotools/factorio
  tag: stable-rootless  # Runs as UID 1000, avoids permission issues
  pullPolicy: IfNotPresent

# Resource allocation
resources:
  requests:
    memory: 2Gi
    cpu: 1000m
  limits:
    memory: 4Gi
    cpu: 2000m

# Persistent storage for saves and mods
persistence:
  enabled: true
  storageClass: nfs-client  # Change to your storage class
  size: 50Gi
  mountPath: /factorio

# Network configuration (NodePort for home cluster access)
service:
  type: NodePort
  ports:
    - name: game
      port: 34197
      nodePort: 30197  # Change if port is already in use
      protocol: UDP
    - name: rcon
      port: 27015
      nodePort: 30015  # Change if port is already in use
      protocol: TCP

# Environment variables
env:
  - name: UPDATE_MODS_ON_START
    value: "false"  # Set to "true" to auto-update mods
  - name: SAVE_NAME
    value: "save1"  # Name of the save file
  - name: GENERATE_NEW_SAVE
    value: "false"  # Set to "true" to create new world on first start

# Factorio server settings
# Documentation: https://wiki.factorio.com/Multiplayer#Setting_up_a_multiplayer_game
gameConfig:
  server-settings:
    enabled: true
    mountPath: /factorio/config-readonly
    configFormat: json
    # Server settings (generates server-settings.json)
    # Override individual settings as needed
    config:
      name: "My Factorio Server"
      description: "A Factorio server running on Kubernetes"
      tags:
        - game
        - tags
      max_players: 10
      visibility:
        public: false
        lan: true
      username: ""  # Factorio.com username for public server listing
      password: ""  # Factorio.com password for public server listing
      token: ""     # Factorio.com auth token
      game_password: ""  # Password players need to join
      require_user_verification: false
      max_upload_in_kilobytes_per_second: 0
      max_upload_slots: 5
      minimum_latency_in_ticks: 0
      ignore_player_limit_for_returning_players: false
      allow_commands: "admins-only"  # "true", "false", or "admins-only"
      autosave_interval: 10  # Minutes between autosaves
      autosave_slots: 5      # Number of autosave slots
      afk_autokick_interval: 0  # Minutes before AFK kick (0 = disabled)
      auto_pause: true
      only_admins_can_pause_the_game: true
      autosave_only_on_server: true
      non_blocking_saving: false
      minimum_segment_size: 25
      minimum_segment_size_peer_count: 20
      maximum_segment_size: 100
      maximum_segment_size_peer_count: 10
    # Advanced: Direct file control (overrides config)
    # Use this if you need complete control over server-settings.json
    # file: |
    #   {
    #     "name": "Custom Server",
    #     ...
    #   }

# Pod-level security context (no runAsNonRoot to allow init container)
podSecurityContext:
  fsGroup: 1000  # rootless image runs as UID 1000

# Container-level security context
containerSecurityContext:
  runAsUser: 1000
  runAsNonRoot: true
  allowPrivilegeEscalation: false

# Init container to fix volume permissions and copy config
# Required for some storage classes that don't respect fsGroup
initContainers:
  - name: setup
    image: busybox:latest
    command: ['sh', '-c']
    args:
      - |
        echo "Fixing permissions on /factorio..."
        chown -R 1000:1000 /factorio
        chmod -R 755 /factorio
        echo "Permissions fixed"
        
        echo "Copying config files to writable location..."
        mkdir -p /factorio/config
        if [ -f /factorio/config-readonly/server-settings.json ]; then
          cp /factorio/config-readonly/server-settings.json /factorio/config/server-settings.json
          chown 1000:1000 /factorio/config/server-settings.json
          echo "Copied server-settings.json"
        fi
        echo "Setup complete"
    securityContext:
      runAsUser: 0  # Must run as root to chown
    volumeMounts:
      - name: data
        mountPath: /factorio
      - name: game-config
        mountPath: /factorio/config-readonly

# Optional: Pin to specific node (e.g., node with more RAM)
nodeSelector: {}
  # kubernetes.io/hostname: node1

# Optional: Tolerations
tolerations: []
