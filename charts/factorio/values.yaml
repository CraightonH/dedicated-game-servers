# Factorio Dedicated Server Configuration

# Server identity
name: factorio

# Factorio Docker image
# Using rootless variant to avoid NFS permission issues
# See: https://github.com/factoriotools/factorio-docker/blob/master/PERMISSION_ISSUES_GUIDE.md
image:
  repository: factoriotools/factorio
  tag: stable-rootless  # Runs as UID 1000, avoids permission issues
  pullPolicy: IfNotPresent

# Resource allocation
resources:
  requests:
    memory: 2Gi
    cpu: 1000m
  limits:
    memory: 4Gi
    cpu: 2000m

# Persistent storage for saves and mods
persistence:
  enabled: true
  storageClass: nfs-client  # Change to your storage class
  size: 50Gi
  mountPath: /factorio

# Network configuration (NodePort for home cluster access)
service:
  type: NodePort
  ports:
    - name: game
      port: 34197
      nodePort: 30197  # Change if port is already in use
      protocol: UDP
    - name: rcon
      port: 27015
      nodePort: 30015  # Change if port is already in use
      protocol: TCP

# Environment variables
env:
  - name: UPDATE_MODS_ON_START
    value: "false"  # Set to "true" to auto-update mods
  - name: SAVE_NAME
    value: "save1"  # Name of the save file
  - name: GENERATE_NEW_SAVE
    value: "false"  # Set to "true" to create new world on first start

# Factorio server settings (camelCase for Helm, converted to snake_case for server-settings.json)
# Documentation: https://wiki.factorio.com/Multiplayer#Setting_up_a_multiplayer_game
gameConfig:
  enabled: true
  mountPath: /factorio/config
  
  # User-friendly server settings (generates server-settings.json)
  # Override individual settings as needed
  serverSettings:
    name: "My Factorio Server"
    description: "A Factorio server running on Kubernetes"
    tags:
      - game
      - tags
    maxPlayers: 10
    visibility:
      public: false
      lan: true
    username: ""  # Factorio.com username for public server listing
    password: ""  # Factorio.com password for public server listing
    token: ""     # Factorio.com auth token
    gamePassword: ""  # Password players need to join
    requireUserVerification: false
    maxUploadInKilobytesPerSecond: 0
    maxUploadSlots: 5
    minimumLatencyInTicks: 0
    ignorePlayerLimitForReturningPlayers: false
    allowCommands: "admins-only"  # "true", "false", or "admins-only"
    autosaveInterval: 10  # Minutes between autosaves
    autosaveSlots: 5      # Number of autosave slots
    afkAutokickInterval: 0  # Minutes before AFK kick (0 = disabled)
    autoPause: true
    onlyAdminsCanPauseTheGame: true
    autosaveOnlyOnServer: true
    nonBlockingSaving: false
    minimumSegmentSize: 25
    minimumSegmentSizePeerCount: 20
    maximumSegmentSize: 100
    maximumSegmentSizePeerCount: 10
  
  # Advanced: Direct file control (overrides serverSettings)
  # Use this if you need complete control over server-settings.json
  files: {}
    # server-settings.json: |
    #   {
    #     "name": "Custom Server",
    #     ...
    #   }

# Pod-level security context (no runAsNonRoot to allow init container)
podSecurityContext:
  fsGroup: 1000  # rootless image runs as UID 1000

# Container-level security context
containerSecurityContext:
  runAsUser: 1000
  runAsNonRoot: true
  allowPrivilegeEscalation: false

# Init container to fix volume permissions
# Required for some storage classes that don't respect fsGroup
initContainers:
  - name: fix-permissions
    image: busybox:latest
    command: ['sh', '-c']
    args:
      - |
        echo "Fixing permissions on /factorio..."
        chown -R 1000:1000 /factorio
        chmod -R 755 /factorio
        echo "Permissions fixed"
    securityContext:
      runAsUser: 0  # Must run as root to chown
    volumeMounts:
      - name: data
        mountPath: /factorio

# Optional: Pin to specific node (e.g., node with more RAM)
nodeSelector: {}
  # kubernetes.io/hostname: node1

# Optional: Tolerations
tolerations: []
