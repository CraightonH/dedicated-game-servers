name: Publish Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - 'chart/**'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Package Helm chart
        run: |
          mkdir -p .cr-release-packages
          helm package chart -d .cr-release-packages

      - name: Checkout gh-pages branch
        run: |
          git fetch origin gh-pages:gh-pages || git checkout --orphan gh-pages
          git checkout gh-pages

      - name: Update Helm repository index
        run: |
          # Copy packaged chart to gh-pages branch
          cp .cr-release-packages/*.tgz .
          
          # Generate/update index
          helm repo index . --url https://craightonh.github.io/dedicated-game-servers/
          
          # Commit and push
          git add *.tgz index.yaml
          git commit -m "Publish Helm chart from ${GITHUB_SHA::7}" || echo "No changes to commit"
          git push origin gh-pages

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: true
