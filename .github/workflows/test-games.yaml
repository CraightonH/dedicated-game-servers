name: Test Game Deployments

on:
  pull_request:
    paths:
      - 'chart/**'
      - 'games/**'
      - '.github/workflows/test-games.yaml'
  push:
    branches:
      - main
    paths:
      - 'chart/**'
      - 'games/**'

jobs:
  # Detect which games were modified
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      games: ${{ steps.set-games.outputs.games }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed games
        id: set-games
        run: |
          # Get list of changed files
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }})
          else
            # For push events, try to diff with parent
            # If no parent (first commit), test all games
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
            else
              echo "First commit detected, testing all games"
              CHANGED_FILES=$(git ls-files)
            fi
          fi
          
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          # Find games that have test.sh and were affected by changes
          GAMES_TO_TEST=()
          for game_dir in games/*/; do
            game=$(basename "$game_dir")
            
            # Check if game has test.sh
            if [ -f "games/$game/test.sh" ]; then
              # Check if chart or this game's files changed
              if echo "$CHANGED_FILES" | grep -q "^chart/\|^games/$game/"; then
                GAMES_TO_TEST+=("$game")
              fi
            fi
          done
          
          # Convert array to JSON for matrix
          if [ ${#GAMES_TO_TEST[@]} -eq 0 ]; then
            echo "games=[]" >> $GITHUB_OUTPUT
            echo "No games to test"
          else
            GAMES_JSON=$(printf '%s\n' "${GAMES_TO_TEST[@]}" | jq -R . | jq -s .)
            echo "games=$GAMES_JSON" >> $GITHUB_OUTPUT
            echo "Games to test: ${GAMES_TO_TEST[@]}"
          fi

  # Run tests for each changed game
  test-game:
    needs: detect-changes
    if: needs.detect-changes.outputs.games != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJson(needs.detect-changes.outputs.games) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Set up kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ${{ matrix.game }}-test
          wait: 120s

      - name: Deploy ${{ matrix.game }}
        run: |
          echo "🚀 Deploying ${{ matrix.game }}..."
          
          # Install with CI-optimized settings
          helm install ${{ matrix.game }}-test ./chart \
            --values ./games/${{ matrix.game }}/values.yaml \
            --set name=${{ matrix.game }} \
            --set persistence.storageClass="" \
            --set persistence.size="1Gi" \
            --set resources.requests.memory="512Mi" \
            --set resources.limits.memory="1Gi" \
            --wait --timeout=5m

      - name: Verify deployment resources
        run: |
          echo "📦 Checking Kubernetes resources..."
          kubectl get pods -l app=${{ matrix.game }}
          kubectl get svc ${{ matrix.game }}
          kubectl get pvc ${{ matrix.game }}-data

      - name: Run ${{ matrix.game }} validation
        run: |
          echo "✅ Running game-specific validation..."
          chmod +x ./games/${{ matrix.game }}/test.sh
          ./games/${{ matrix.game }}/test.sh

      - name: Get pod logs on failure
        if: failure()
        run: |
          echo "📋 Pod logs:"
          kubectl logs -l app=${{ matrix.game }} --tail=200

      - name: Cleanup
        if: always()
        run: |
          helm uninstall ${{ matrix.game }}-test || true
