name: Test Game Charts

on:
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/test-games.yaml'
  push:
    branches:
      - main
    paths:
      - 'charts/**'

jobs:
  # Detect which game charts were modified
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      games: ${{ steps.set-games.outputs.games }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed game charts
        id: set-games
        run: |
          set -e  # Exit on error
          
          # Get list of changed files
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} || echo "")
          else
            # For push events, try to diff with parent
            # If no parent (first commit), test all games
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              CHANGED_FILES=$(git diff --name-only HEAD^ HEAD || echo "")
            else
              echo "First commit detected, testing all games"
              CHANGED_FILES=$(git ls-files || echo "")
            fi
          fi
          
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          # Find game charts that have test.sh and were affected by changes
          GAMES_TO_TEST=()
          
          # Check if charts directory exists
          if [ ! -d "charts" ]; then
            echo "No charts directory found"
            echo "games=[]" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          for chart_dir in charts/*/; do
            # Skip if no directories found
            [ -d "$chart_dir" ] || continue
            
            chart=$(basename "$chart_dir")
            
            # Skip library chart
            if [ "$chart" = "game-server-library" ]; then
              continue
            fi
            
            # Check if chart has test.sh
            if [ -f "charts/$chart/test.sh" ]; then
              # Check if library chart or this game chart changed
              if echo "$CHANGED_FILES" | grep -q "^charts/game-server-library/\|^charts/$chart/" || [ -z "$CHANGED_FILES" ]; then
                GAMES_TO_TEST+=("$chart")
              fi
            fi
          done
          
          # Convert array to JSON for matrix
          if [ ${#GAMES_TO_TEST[@]} -eq 0 ]; then
            echo "games=[]" >> $GITHUB_OUTPUT
            echo "No game charts to test"
          else
            GAMES_JSON=$(printf '%s\n' "${GAMES_TO_TEST[@]}" | jq -R . | jq -sc . || echo '[]')
            echo "games=$GAMES_JSON" >> $GITHUB_OUTPUT
            echo "Game charts to test: ${GAMES_TO_TEST[@]}"
          fi

  # Run tests for each changed game chart
  test-game:
    needs: detect-changes
    if: needs.detect-changes.outputs.games != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJson(needs.detect-changes.outputs.games) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Build chart dependencies
        run: |
          echo "📦 Building dependencies for ${{ matrix.game }}..."
          cd charts/${{ matrix.game }}
          helm dependency build
          cd ../..

      - name: Set up kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ${{ matrix.game }}-test
          wait: 120s

      - name: Install local-path-provisioner for proper fsGroup support
        run: |
          echo "📦 Installing Rancher local-path-provisioner..."
          kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.28/deploy/local-path-storage.yaml
          
          # Wait for provisioner to be ready
          kubectl wait --for=condition=available --timeout=60s deployment/local-path-provisioner -n local-path-storage
          
          # Set as default storage class
          kubectl patch storageclass local-path -p '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
          
          echo "✅ Storage provisioner ready"

      - name: Deploy ${{ matrix.game }} chart
        run: |
          echo "🚀 Deploying ${{ matrix.game }} chart..."
          
          # Install with CI-optimized settings
          helm install ${{ matrix.game }}-test ./charts/${{ matrix.game }} \
            --set persistence.storageClass="local-path" \
            --set persistence.size="1Gi" \
            --set resources.requests.memory="512Mi" \
            --set resources.limits.memory="1Gi" \
            --wait --timeout=5m

      - name: Verify deployment resources
        run: |
          echo "📦 Checking Kubernetes resources..."
          kubectl get pods -l app=${{ matrix.game }}
          kubectl get svc ${{ matrix.game }}
          kubectl get pvc ${{ matrix.game }}-data

      - name: Run ${{ matrix.game }} validation
        run: |
          echo "✅ Running game-specific validation..."
          chmod +x ./charts/${{ matrix.game }}/test.sh
          ./charts/${{ matrix.game }}/test.sh

      - name: Get pod logs on failure
        if: failure()
        run: |
          echo "📋 Pod logs:"
          kubectl logs -l app=${{ matrix.game }} --tail=200

      - name: Cleanup
        if: always()
        run: |
          helm uninstall ${{ matrix.game }}-test || true
