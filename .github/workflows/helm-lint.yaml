name: Helm Lint

on:
  pull_request:
    paths:
      - 'chart/**'
      - 'games/**'
  push:
    branches:
      - main
    paths:
      - 'chart/**'
      - 'games/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Lint Helm chart
        run: |
          helm lint ./chart

      - name: Lint Factorio values
        run: |
          helm lint ./chart --values ./games/factorio/values.yaml

      # Add more games as they're implemented
