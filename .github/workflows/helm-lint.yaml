name: Helm Lint

on:
  pull_request:
    paths:
      - 'charts/**'
  push:
    branches:
      - main
    paths:
      - 'charts/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Lint game-server-library
        run: |
          helm lint ./charts/game-server-library

      - name: Lint factorio chart
        run: |
          cd charts/factorio
          helm dependency build
          cd ../..
          helm lint ./charts/factorio

      # Add more game charts as they're implemented
